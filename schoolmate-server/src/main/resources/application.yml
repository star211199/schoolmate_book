server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 邮件服务（找回密码验证码，可选）。取消注释并填写 SMTP 信息后自动启用；
  # 不配置 spring.mail.host 时 JavaMailSender 不会创建，找回密码接口会提示
  # 「邮件服务未配置」，其余功能不受影响。
  # QQ 邮箱示例（password 填 SMTP 授权码，不是登录密码）：
  # mail:
  #   host: smtp.qq.com
  #   port: 465
  #   username: your@qq.com
  #   password: <SMTP授权码>
  #   properties:
  #     mail.smtp.ssl.enable: true

schoolmate:
  jwt:
    secret: schoolmate_book_jwt_secret_key_please_change_in_production_2026
    expire-minutes: 1440
  upload:
    # 上传根目录（与 jar 分离，运行期可写）
    base-dir: ./upload
    access-prefix: /upload/**
  content:
    # 内容发布是否需要管理员审核：false 表示发布即通过（PASSED）
    audit-enabled: false
